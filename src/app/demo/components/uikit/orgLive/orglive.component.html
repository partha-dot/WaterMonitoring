                      <div class="grid p-fluid">
            <div class="col-12 lg:col-6 xl:col-4" *ngFor="let device of cities">
                <div class="button-badge-wrapper">
                <button
                    (click)="dodi(device)"
                    pButton
                    pRipple
                    type="button"
                    icon="pi pi-arrow-circle-down"
                      [ngClass]="{
                    'button-online': device.status === 'Y',
                    'button-offline': device.status !== 'Y'
                    }"
                    class="p-button-rounded p-button-outlined"
                >
                    {{ device.device_name }}
                    <p-badge
                    [value]="device.status === 'Y' ? 'Online' : 'Offline'"
                    [severity]="device.status === 'Y' ? 'success' : 'danger'"
                    class="badge-inside-button"
                ></p-badge>
                </button>
                
                </div>
            </div>
            </div>
